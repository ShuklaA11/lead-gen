# Example config. Run `python -m src.setup` to generate your own config.yaml
# interactively, or copy this file to config.yaml and edit by hand.
# config.yaml is gitignored (it holds your campaign content).

# --- Files -------------------------------------------------------------------
input_csv: data/input.csv               # your lead list
output_csv: data/master-lead-list.csv   # the master list (canonical output)

# Override the auto-derived person_id prefix per company. The default is an
# acronym of the company name ("Navy Federal Credit Union" -> NFCU); set an
# explicit value here when the acronym isn't what you want.
company_prefixes:
  Navy Federal Credit Union: NFCU

# --- CSV column mapping ------------------------------------------------------
# Which header in your CSV maps to each concept. The setup wizard auto-detects
# these from common names; override here if your headers differ.
columns:
  name: Name
  company: Company
  role: Role
  category: Category   # used to pick a per-segment angle; leave blank if none
  linkedin: Linkedin   # existing LinkedIn URLs improve Apollo match accuracy

# --- What you're offering ----------------------------------------------------
product:
  description: >
    One or two sentences describing your product/offer. This grounds every
    email so they don't read as generic.

# --- Who the email is from ---------------------------------------------------
sender:
  name: Jane Doe
  email: jane@example.com
  signature: |
    Jane Doe
    Founder, Example Co
    https://example.com
  booking_link: ""   # optional: a Calendly/Cal.com link the email can offer

# --- Outreach angle per segment ----------------------------------------------
# Keys must match the values found in your `category` column. The wizard
# pre-fills one entry per distinct category it finds in your CSV.
segments:
  Affiliate/Media:
    angle: >
      Why affiliate and media contacts specifically should care about the offer.
  FI:
    angle: >
      Why financial-institution contacts specifically should care.

# Used for leads whose category is empty or not listed above.
default_angle: >
  A general value proposition that works for anyone on the list.

# --- Email generation --------------------------------------------------------
generation:
  model: claude-opus-4-8   # claude-sonnet-4-6 is cheaper/faster if preferred
  max_tokens: 1024
  tone: warm, concise, professional, not salesy
  word_limit: 120          # keep cold emails short

# --- Per-person web research (Claude web_search) -----------------------------
# Runs one Claude call per person; the model searches the web and returns a
# top_hook + a fit-based target_priority + flags, judged against campaign_brief.
# This OVERRIDES the rule-based priority/flags below. Profiles are written to
# profiles_dir as JSON and referenced from each row's Info dump.
research:
  model: claude-opus-4-8
  max_searches: 5          # web_search tool max uses per person
  max_tokens: 4096
  profiles_dir: enrichment/profiles
  campaign_brief: >
    Describe who you're targeting and why, and what makes a contact High vs Med
    vs Low priority for THIS campaign (e.g. "Marketing leaders at large credit
    unions who own brand/analytics; High = VP+ owning brand or marketing
    analytics, Med = AVP/manager in marketing, Low = retired or non-marketing").
    The researcher judges fit and writes the outreach hook against this.

# --- Apollo enrichment -------------------------------------------------------
apollo:
  reveal_personal_emails: true
  batch_size: 10           # Apollo bulk_match max is 10 per call

# --- Target prioritization (rule-based, no LLM) ------------------------------
# A lead is High if its title contains any high_keyword OR its Apollo seniority
# is in high_seniorities; Med if seniority is in med_seniorities; else Low.
priority:
  high_keywords: [lending, credit, risk, consumer banking]
  high_seniorities: [c_suite, owner, founder, partner]
  med_seniorities: [vp, director, head]

# Verification flags raised from simple title heuristics.
flags:
  retired_keywords: [retired, former]
